title = "Neyra gitleaks"

# Extend default rules — bare config without this disables all rules (AR-57).
[extend]
useDefault = true

# Historical fake token from 640c57e (fixed in tip). Keep allowlist narrow.
[[allowlists]]
id = "test-errors-and-trace-fixture"
description = "Intentional redaction fixture markers (not real credentials)"
regexTarget = "match"
regexes = [
  '''sk-leak123456789012''',
  '''SECRET_PATH_/tmp/leak_and_token=''',
]
paths = [
  '''server/tests/test_errors_and_trace\.py''',
]
