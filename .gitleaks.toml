# Extend default rules — a bare config with no [[rules]] disables scanning (AR-57).
[extend]
useDefault = true

title = "Neyra gitleaks"

# Narrow allowlist: only intentional fake leak markers in one test file (history of 640c57e).
[[allowlists]]
description = "Intentional redaction fixture markers (not real credentials)"
paths = [
  '''(^|/)server/tests/test_errors_and_trace\.py$''',
]
