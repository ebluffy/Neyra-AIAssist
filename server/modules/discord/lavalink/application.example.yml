server:
  port: 2333
  # Managed local default: loopback only. Change only if you intentionally expose Lavalink.
  address: 127.0.0.1
  http2:
    enabled: false

lavalink:
  # plugins/*.jar в git часто — Git LFS pointer → Lavalink падает с ZipException. Починка: python scripts/fetch_lavalink_plugins.py
  # youtube-plugin: 1.18.2 ещё не содержит PS4-UA фикс TVHTML5 (b33460b), из-за
  # которого YouTube отдаёт "The page needs to be reloaded". Держим snapshot
  # b33460b до выхода релиза с этим коммитом.
  pluginsDir: "./plugins"
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:b33460b38ad13b5cd07da75e46444397cf0ea2df"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
      snapshot: false
  server:
    # Must match discord.music.nodes[].password; never ship a public default.
    password: "CHANGE_ME"
    sources:
      youtube: false
      bandcamp: true
      # SoundCloud now serves AAC-HLS; Lavaplayer's built-in source cannot play it.
      # soundy-plugin handles it instead, so the built-in source must stay off.
      soundcloud: false
      twitch: true
      vimeo: true
      nico: false
      # Off: Discord play only allows allowlisted hosts (YouTube, SoundCloud, Bandcamp, Vimeo, Twitch) — no icy:// / LAN SSRF.
      http: false
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    nonAllocatingFrameBuffer: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: MEDIUM
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    gc-warnings: true
    timeouts:
      connectTimeoutMs: 4000
      connectionRequestTimeoutMs: 4000
      socketTimeoutMs: 4000

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # TV — OAuth playback. MUSIC/ANDROID_* — search only (playback: false).
    # В 1.18+ TVHTML5EMBEDDED удалён; TVHTML5_SIMPLY не использует OAuth.
    # Burner Google only. First boot with empty refreshToken → device URL in Lavalink log.
    oauth:
      enabled: true
      refreshToken: ""
      skipInitialization: false
      useYoutubeTvOAuth: true
    clients:
      - MUSIC
      - ANDROID_VR
      - TV
      - WEB
      - WEBEMBEDDED
    clientOptions:
      MUSIC:
        playback: false
      ANDROID_VR:
        playback: false
      ANDROID_MUSIC:
        playback: false
  lavasrc:
    providers:
      - "ytsearch:%QUERY%"
      - "ytmsearch:%QUERY%"
      - "spsearch:%QUERY%"
      - "amsearch:%QUERY%"
      - "dzsearch:%QUERY%"
    sources:
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      jiosaavn: false
    spotify:
      clientId: ""
      clientSecret: ""
      countryCode: "RU"
      playlistLoadLimit: 6
      albumLoadLimit: 6
    applemusic:
      mediaAPIToken: ""
      countryCode: "RU"
      playlistLoadLimit: 6
      albumLoadLimit: 6
  # soundy: AAC-HLS SoundCloud source. Jar is installed by
  # scripts/fetch_lavalink_plugins.py; built-in soundcloud source must be false.
  soundy:
    enabled: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: "local"

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    com.sedmelluq.discord.lavaplayer: INFO
    dev.lavalink.youtube: INFO
    com.github.topi314.lavasrc: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: false
    maxPayloadLength: 4096
    beforeRequest: false
  logback:
    rollingpolicy:
      max-file-size: 512MB
      max-history: 14
