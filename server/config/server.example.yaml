# Neyra config layer: config/server.yaml
# Core API (core.api) + dashboard static defaults.
#
api:
  # EN: Also exposes GET /v1/llm/balance for active providers; GET /v1/meta, /v1/llm/models.
  # RU: Также GET /v1/llm/balance; GET /v1/meta, /v1/llm/models.
  host: "127.0.0.1"
  port: 8787

  # EN: Single public origin for dashboard UI (/), API, OpenAPI, clients.
  #     Empty = local-only. Set the hostname you already pointed at the VPS in DNS
  #     (e.g. Cloudflare A record neyra → VPS IP). Not configured via .env.
  # RU: Единый публичный origin: дашборд (/), API, OpenAPI, клиенты.
  #     Пусто = только localhost. Пишите сюда домен, который уже есть в DNS (не через .env).
  #     Пример: "https://neyra.owyx.site" → UI на /, API на …/api/v1
  public_base_url: ""
  # EN: Path prefix in front of /v1 (reverse proxy). Full API: {public_base_url}{public_path_prefix}/v1
  # RU: Префикс перед /v1. Итого при примере выше: https://neyra.owyx.site/api/v1
  public_path_prefix: "/api"

  # EN: Optional global RPM limit per client IP (0 = disabled). Applies to /v1 HTTP except /v1/ws.
  # RU: Опциональный лимит запросов/мин на IP (0 = выкл.), для /v1 кроме WebSocket.
  rate_limit_requests_per_minute: 0

  # EN: If set, POST /v1/webhooks/in/... requires header X-Neyra-Signature: sha256=<hex> (HMAC-SHA256 of raw body).
  # RU: Если задан — входящий webhook только с подписью (см. также WEBHOOK_INBOUND_SECRET в .env).
  # webhook_inbound_secret: ""

  # EN: Append-only JSONL audit for sensitive API ops (set false to disable file writes).
  # RU: JSONL-аудит критичных операций (false — не писать файл).
  audit_log_enabled: true
  audit_log_path: "./logs/api_audit.jsonl"

  # EN: Allow POST /v1/debug/lifecycle (stop/restart process). Prefer POST /v1/system/restart (maint+).
  # RU: Разрешить debug lifecycle. Предпочтительнее POST /v1/system/restart (maint+).
  debug_lifecycle_enabled: false

  websocket:
    idle_timeout_seconds: 60
    ping_interval_seconds: 20
    close_grace_seconds: 5

  level: "INFO"

dashboard:
  enabled: true
  dist_path: "dashboard/dist"
  require_build: false
  # Public URL for the UI is api.public_base_url (same host). No separate dashboard domain key.
