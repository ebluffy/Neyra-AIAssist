# Neyra config layer: config/llm.yaml
# EN/RU: see docs/PLAN.md §1d and docs/config-keys.md
#
# Dual-backend (recommended for RU):
#   BACKEND: aihope  — default for brain / memory / vision
#   openrouter.talk_model.provider: openrouter — free Qwen talk lane
#
BACKEND: aihope

# Optional per-provider overrides (api_key usually from .env).
llm:
  providers:
    aihope:
      base_url: "https://aihope.fun/v1"
      # api_key: from AIHOPE_API_KEY
    openrouter:
      base_url: "https://openrouter.ai/api/v1"
      # api_key: from OPENROUTER_API_KEY

# Role models live under `openrouter:` for backward compatibility (name = historical).
# Each role may set `provider:` to override BACKEND.
openrouter:
  api_key: ""
  context_window: 16384
  timeout_seconds: 30.0
  max_retries: 1

  talk_model:
    # Free low-censorship talk on OpenRouter (Qwen 3.8).
    provider: openrouter
    model: "qwen/qwen3.8-27b:free"
    reply_max_tokens: 220
    lyrics_reply_max_tokens: 4096
    temperature: 0.8
    top_p: 1.0
    presence_penalty: 0.3
    frequency_penalty: 0.3
    timeout_seconds: 30.0
    max_retries: 1
    primary_first_token_timeout_seconds: 8.0

  brain_model:
    # AIHope — GPT-6 Luna (friend gateway; easy top-up from RU).
    provider: aihope
    model: "gpt-6-luna"
    model_deep: "gpt-6-luna"
    temperature: 0.35
    top_p: 1.0
    timeout_seconds: 30.0
    max_retries: 1

  memory_model:
    provider: aihope
    model: "gpt-6-luna"
    temperature: 0.6
    timeout_seconds: 60.0
    max_retries: 1

  vision_model:
    enabled: true
    use_brain_model_for_vision: true
    provider: aihope
    model: "gpt-6-luna"
    max_tokens: 800
    temperature: 0.75
    timeout_seconds: 180.0
    max_images_per_message: 4
    max_image_bytes: 8388608
    max_image_width: 1920
    max_image_height: 1080
    remember_last_image: true
    last_image_note_max_chars: 1200

  micro_planning:
    enabled: false
    mode: "tags"
    prefill_enabled: false
    start_tag: "[PLAN]"
    end_tag: "[/PLAN]"
    anchor_plan: "PLAN:"
    anchor_reply: "SAY:"

  async_reflection:
    enabled: true
    temperature: 0.6
    max_tokens: 1200
    timeout_seconds: 60
    max_retries: 1
    max_note_chars: 1200

  max_tokens: 1500

# AIHope OpenAI-compatible surface (used via base_url https://aihope.fun/v1):
#   GET  /models
#   POST /chat/completions   ← agent default (LangChain ChatOpenAI)
#   POST /responses
#   POST /messages           (Claude-compatible)
#   POST /images/generations
# Balance (non-/v1): GET https://aihope.fun/api/usage/token/
