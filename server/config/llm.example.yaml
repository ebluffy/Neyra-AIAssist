# Neyra config layer: config/llm.yaml
# Dual-backend: roles under llm.*; keys only from .env (AIHOPE_API_KEY / OPENROUTER_API_KEY)
#
llm:
  providers:
    aihope:
      base_url: "https://aihope.fun/v1"
      # Enable only if the gateway supports stream_options.include_usage.
      capabilities:
        supports_stream_usage: false
    openrouter:
      base_url: "https://openrouter.ai/api/v1"

    # Experimental CLI backend (#77): ядро вызывает установленный OpenCode через
    # bwrap. Требует bubblewrap на хосте, experimental: true и путь к версии CLI.
    # Инструменты в запрос не попадают: read-only конфиг + плагин, HOME — tmpfs.
    # Ограничения: brain без tools, vision нет, max_tokens не поддерживается.
    # oc:
    #   kind: cli
    #   cli: opencode
    #   backend: run
    #   experimental: true
    #   # Только каталог проверенной версии CLI (provider-runtimes/opencode/...).
    #   cli_path: "/var/lib/openbot/.config/OpenBot/provider-runtimes/opencode/linux-x64/2.3.0/bin/opencode"
    #   # Необязателен: по умолчанию <paths.data_dir>/cli-sandbox. Относительный
    #   # путь считается от data_dir, абсолютный должен быть внутри него.
    #   # sandbox: "<путь из paths.data_dir>/cli-sandbox"
    #   # Файл авторизации OpenCode; read-only bind внутрь песочницы.
    #   # Только внутри cli-sandbox. Относительный путь — от data_dir.
    #   # auth_file: "<путь из paths.data_dir>/cli-sandbox/data/opencode/auth.json"
    #   timeout_seconds: 120
    # Затем: talk_model/brain_model/memory_model: {provider: oc, model: "opencode/<model>"}

  # Optional plugin generation role. If omitted, uses brain_model/provider.
  # coder_model:
  #   provider: aihope
  #   model: "your-coder-model"

  # Model ids (of the current talk provider) allowed for the web role.
  # The configured default talk model is always allowed. Empty = default only.
  chat_models_allowed_for_web: []

  talk_model:
    responses:
      enabled: false
      warmup_on_start: false
    provider: openrouter
    model: "qwen/qwen3.8-27b:free"
    reply_max_tokens: 220
    lyrics_reply_max_tokens: 4096
    # Responses max_output_tokens = visible cap + headroom, so reasoning and [PLAN]
    # do not consume the reply. Unset headroom defaults to 2048.
    # output_token_headroom: 2048
    # max_output_tokens: 2268
    # Shared budget for stacked first-token retries. Unset uses timeout_seconds.
    # turn_timeout_seconds: 30.0
    temperature: 0.8
    top_p: 1.0
    presence_penalty: 0.3
    frequency_penalty: 0.3
    timeout_seconds: 30.0
    max_retries: 1
    # aihope deepseek TTFT often 10–20s; 6–8s kills healthy slow streams
    primary_first_token_timeout_seconds: 20.0

  brain_model:
    provider: aihope
    model: "gpt-6-luna"
    model_deep: "gpt-6-luna"
    temperature: 0.35
    top_p: 1.0
    timeout_seconds: 30.0
    max_retries: 1

  memory_model:
    provider: aihope
    model: "gpt-6-luna"
    temperature: 0.6
    timeout_seconds: 60.0
    max_retries: 1

  vision_model:
    enabled: true
    use_brain_model_for_vision: true
    provider: aihope
    model: "gpt-6-luna"
    max_tokens: 800
    temperature: 0.75
    timeout_seconds: 180.0
    max_images_per_message: 4
    max_image_bytes: 8388608
    max_image_width: 1920
    max_image_height: 1080
    remember_last_image: true
    last_image_note_max_chars: 1200

  micro_planning:
    enabled: false
    mode: "tags"
    prefill_enabled: false
    start_tag: "[PLAN]"
    end_tag: "[/PLAN]"
    anchor_plan: "PLAN:"
    anchor_reply: "SAY:"

  # Deprecated, ignored: use memory.diary_after_turn (one canonical scoped diary job).
  async_reflection:
    enabled: false
    temperature: 0.6
    max_tokens: 1200
    timeout_seconds: 60
    max_retries: 1
    max_note_chars: 1200

# AIHope (https://aihope.fun/v1): /models /chat/completions /responses /messages /images/generations
# Balance: GET https://aihope.fun/api/usage/token/
