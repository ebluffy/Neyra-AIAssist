# Neyra in Docker Desktop (Windows/Mac/Linux).
# Setup: copy server/.env.example → server/.env, then: docker compose up --build
#
# API from host: http://127.0.0.1:8787/v1/health
# MCP (Cursor on host): NEYRA_API_BASE=http://127.0.0.1:8787, NEYRA_API_TOKEN=<INTERNAL_API_TOKEN>
# MCP logs: point NEYRA_LOG_PATH at a file under ./server/logs or open the repo on the host.

services:
  neyra:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      # Listen on all interfaces inside the container (required for port publish).
      INTERNAL_API_BIND_HOST: "0.0.0.0"
      # Allow POST /v1/debug/lifecycle (stop/restart); without it the endpoint returns 403.
      NEYRA_DEBUG_LIFECYCLE: "1"
    volumes:
      - ./server/config.yaml:/app/config.yaml
      - ./server/modules:/app/modules
      - ./server/data/memory:/app/data/memory
      - ./server/logs:/app/logs
      # Optional: prebuilt dashboard
      - ./server/dashboard/dist:/app/dashboard/dist:ro
    restart: unless-stopped
