[package]
name = "neyra-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[lib]
name = "neyra_client"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
base64 = "0.22"
cpal = "0.15"
rodio = { version = "0.20", default-features = false, features = ["wav"] }

tauri-plugin-global-shortcut = "2"
shlex = "1"
libc = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
jpeg-encoder = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
png = "0.17"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
