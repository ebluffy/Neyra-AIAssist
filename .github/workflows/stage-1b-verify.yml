name: Stage 1b verify

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  push:
    branches:
      - refactor/stage-1b-layout
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server deps (minimal for compileall)
        run: pip install -q pyyaml python-dotenv httpx
      - name: compileall
        run: python -m compileall -q server devtools/mcp_server
      - name: verify_stage_1b (fresh clone mode)
        run: python server/scripts/verify_stage_1b.py
      - name: healthcheck smoke (example config, skip HTTP)
        env:
          OPENROUTER_API_KEY: ci-placeholder-not-used-with-skip-http
          DISCORD_TOKEN: ci-placeholder-not-a-real-token
        run: |
          cp server/config.example.yaml server/config.yaml
          printf '%s\n' 'OPENROUTER_API_KEY=ci-placeholder' 'DISCORD_TOKEN=ci-placeholder' > server/.env
          cd server && python scripts/healthcheck.py --mode core --skip-http
