name: Desktop release
# Builds signed installers and updater metadata in a draft; publishes only after every build succeeds.
on:
  push:
    tags:
      - 'client-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example client-v0.1.0-beta.1'
        required: true
permissions:
  contents: write
concurrency:
  group: client-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: tag
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#client-v}" >> "$GITHUB_OUTPUT"
          case "${tag#client-v}" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
      - name: Versions match the tag
        run: node scripts/check-versions.mjs "$TAG"
        working-directory: client
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - name: Signing secrets and public key are present
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set. See docs/RELEASE.md."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not set. See docs/RELEASE.md."
            exit 1
          fi
          node -e '
            const c = JSON.parse(require("fs").readFileSync("src-tauri/tauri.conf.json", "utf8")).plugins.updater;
            const test = require("fs").readFileSync("src-tauri/updater-test/test.key.pub", "utf8").trim();
            const fail = (message) => { console.error("::error::" + message); process.exit(1); };
            if (!c.pubkey || c.pubkey === "REPLACE_WITH_PRODUCTION_PUBKEY") fail("plugins.updater.pubkey is a placeholder");
            if (c.pubkey.trim() === test) fail("plugins.updater.pubkey is the committed TEST key");
            for (const flag of ["dangerousInsecureTransportProtocol", "dangerousAcceptInvalidCerts", "dangerousAcceptInvalidHostnames", "allowDowngrades"]) if (flag in c) fail(flag + " must stay unset");
            if (c.requireSignedVersion !== true) fail("requireSignedVersion must be true");
          '
        working-directory: client

  build:
    name: Build (${{ matrix.name }})
    needs: preflight
    strategy:
      fail-fast: false
      # tauri-action merges each platform into the same latest.json release asset.
      max-parallel: 1
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libdbus-1-dev
      - run: npm ci --ignore-scripts
        working-directory: client
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: client
          tagName: ${{ needs.preflight.outputs.tag }}
          releaseName: Neyra desktop ${{ needs.preflight.outputs.version }}
          releaseBody: Unsigned code (no Authenticode/SmartScreen certificate).
          releaseDraft: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}
      - name: Signatures match the version and configured public key
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          mapfile -t sigs < <(find src-tauri/target -path '*bundle*' -name '*.sig')
          if [ "${#sigs[@]}" -eq 0 ]; then echo "::error::No updater signatures were produced"; exit 1; fi
          node scripts/check-updater-signature.mjs "$VERSION" "${sigs[@]}"
        working-directory: client
  publish:
    name: Publish release
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    concurrency:
      group: client-beta-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish only after all builds succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
      - name: Update rolling beta feed if this release is newer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/candidate" "$tmp/current"
          gh release download "$TAG" --pattern latest.json --dir "$tmp/candidate"
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "client-beta") | .tag_name, .assets[].name' > "$tmp/feed"
          if grep -Fxq latest.json "$tmp/feed"; then
            gh release download client-beta --pattern latest.json --dir "$tmp/current"
          fi
          current=()
          if [ -f "$tmp/current/latest.json" ]; then current=("$tmp/current/latest.json"); fi
          decision="$(node client/scripts/beta-feed.mjs "$TAG" "$tmp/candidate/latest.json" "${current[@]}")"
          if [ "$decision" = skip ]; then
            echo "client-beta already has this version or a newer one"
            exit 0
          fi
          if [ ! -s "$tmp/feed" ]; then
            gh release create client-beta --prerelease --title 'Neyra beta update feed' --notes 'Rolling updater manifest for the beta channel.'
          fi
          gh release upload client-beta "$tmp/candidate/latest.json" --clobber
